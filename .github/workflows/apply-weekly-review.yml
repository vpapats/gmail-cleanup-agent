name: Apply Approved Weekly Gmail Review

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      review_id:
        description: "Review ID, for example weekly-2026-08-10-2026-08-17"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gmail-fomo-writes
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'gmail-fomo-review-') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.merged_by.login == github.repository_owner
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GMAIL_FOMO_STATE_KEY: ${{ secrets.GMAIL_FOMO_STATE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout approved state
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Select review
        id: review
        shell: bash
        env:
          REVIEW_ID_INPUT: ${{ inputs.review_id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            review_id="$REVIEW_ID_INPUT"
          else
            changed="$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.merge_commit_sha }}" \
              -- 'weekly_reviews/weekly-*.json')"
            if [ "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -ne 1 ]; then
              echo "::error::Expected exactly one weekly review manifest"
              exit 1
            fi
            review_id="$(basename "$changed" .json)"
          fi
          if ! [[ "$review_id" =~ ^weekly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid review ID"
            exit 1
          fi
          echo "review_id=$review_id" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required credentials
        shell: bash
        run: |
          missing=0
          for key in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN GMAIL_FOMO_STATE_KEY GITHUB_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required credential: ${key}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Apply approved labels and learning
        id: apply
        continue-on-error: true
        run: >-
          PYTHONPATH=. python scripts/apply_weekly_review.py
          --review-id "${{ steps.review.outputs.review_id }}"

      - name: Preserve local ledger as workflow evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-review-ledger-${{ steps.review.outputs.review_id }}
          path: weekly_reviews/applied/${{ steps.review.outputs.review_id }}.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce complete apply
        if: steps.apply.outcome != 'success'
        run: |
          echo "::error::Weekly Gmail review was not fully applied. Rerun with workflow_dispatch after resolving the ledger error."
          exit 1
