name: Apply Approved Weekly Gmail Review

on:
  workflow_dispatch:
    inputs:
      review_id:
        description: "Review ID, for example weekly-2026-08-10-2026-08-17"
        required: true
        type: string
      selections_json:
        description: "Complete item-id to label selection map from the signed review UI"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gmail-fomo-writes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GMAIL_FOMO_STATE_KEY: ${{ secrets.GMAIL_FOMO_STATE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Select review
        id: review
        shell: bash
        env:
          REVIEW_ID_INPUT: ${{ inputs.review_id }}
        run: |
          review_id="$REVIEW_ID_INPUT"
          if ! [[ "$review_id" =~ ^weekly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid review ID"
            exit 1
          fi
          echo "review_id=$review_id" >> "$GITHUB_OUTPUT"
          echo "review_branch=gmail-fomo-review-${review_id:7:10}" >> "$GITHUB_OUTPUT"

      - name: Checkout signed review state
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.review.outputs.review_branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required credentials
        shell: bash
        run: |
          missing=0
          for key in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN GMAIL_FOMO_STATE_KEY GITHUB_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required credential: ${key}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Apply approved labels and learning
        id: apply
        continue-on-error: true
        env:
          SELECTIONS_JSON_INPUT: ${{ inputs.selections_json }}
        run: |
          PYTHONPATH=. python scripts/apply_weekly_review.py \
            --review-id "${{ steps.review.outputs.review_id }}" \
            --selections-json "$SELECTIONS_JSON_INPUT"

      - name: Preserve local ledger as workflow evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: weekly-review-ledger-${{ steps.review.outputs.review_id }}
          path: weekly_reviews/applied/${{ steps.review.outputs.review_id }}.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce complete apply
        if: steps.apply.outcome != 'success'
        run: |
          echo "::error::Weekly Gmail review was not fully applied. Rerun with workflow_dispatch after resolving the ledger error."
          exit 1
