name: Migrate Gmail Feedback State

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gmail-triage
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GMAIL_FOMO_STATE_KEY: ${{ secrets.GMAIL_FOMO_STATE_KEY }}
      GMAIL_FOMO_STATE_BRANCH: gmail-fomo-state
      GMAIL_FOMO_STATE_PATH: .gmail-fomo/feedback-state.enc.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          missing=0
          for key in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN GMAIL_FOMO_STATE_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Migrate encrypted feedback state
        run: PYTHONPATH=. python scripts/migrate_feedback_state.py
